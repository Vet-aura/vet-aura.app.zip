crons:
  - name: sms-dispatch
    description: "Sends approved marketing SMS blasts that were queued until clinic quiet hours ended"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/sms-dispatch"
    method: POST
    enabled: true
  - name: care-reminders
    description: "Hourly check that sends vaccine/preventive care reminder texts at each clinic's local send hour"
    cron: "0 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/care-reminders"
    method: POST
    enabled: true
